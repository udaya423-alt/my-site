<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Register for Sports Meet</title>
    <style>

    <script>
        function showForm() {
            document.getElementById("registrationForm").style.display = "block";
        }
    </script>
</head>
<body>

    <button onclick="showForm()">Register</button>

    <div id="registrationForm">
        <h2>Registration Form</h2>
        <!-- For actual submissions, consider using Formspree or Google Forms -->
        <form action="mailto:udayaserasinghe23@gmail.com" method="post" enctype="text/plain">
            <label for="name">名前:</label>
            <input type="text" id="name" name="名前" required>

            <label for="grade">クラス:</label>
